<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <header>
      <h1>Build Your Bouquet</h1>
      <p>Pick flowers and arrange them however you like.</p>
    </header>

    <section class="bouquet-editor">
      <div id="bouquet" class="bouquet"></div>
    </section>

    <section class="flower-picker">
      <button data-flower="rose">🌹</button>
      <button data-flower="tulip">🌷</button>
      <button data-flower="sunflower">🌻</button>
      <button data-flower="daisy">🌼</button>
      <button data-flower="cherry">🌸</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
